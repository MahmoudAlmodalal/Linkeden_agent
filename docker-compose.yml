services:
  n8n:
    build: .
    image: n8n-custom:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    entrypoint: ["/bin/sh", "/scripts/docker-entrypoint.sh"]
    command: ["start"]
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${NGROK_DOMAIN}
      - N8N_EDITOR_BASE_URL=https://${NGROK_DOMAIN}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${GENERIC_TIMEZONE:-UTC}
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - EXECUTIONS_DATA_PRUNE=true
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_TEXT_MODEL=${CLOUDFLARE_TEXT_MODEL:-@cf/meta/llama-3.1-8b-instruct}
      - CLOUDFLARE_IMAGE_MODEL=${CLOUDFLARE_IMAGE_MODEL:-@cf/black-forest-labs/flux-1-schnell}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOWED_USER_ID=${TELEGRAM_ALLOWED_USER_ID}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_PERSON_URN=${LINKEDIN_PERSON_URN}
      - NGROK_DOMAIN=${NGROK_DOMAIN}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
      - ./config:/config
      - ./workflows:/workflows
      - ./assets:/assets
      - ./scripts:/scripts
      - ./node_modules:/scripts/node_modules:ro
      - ./.env:/.env:ro

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    command: http n8n:5678
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      - NGROK_DOMAIN=${NGROK_DOMAIN}
    ports:
      - "4040:4040"
    depends_on:
      - n8n

volumes:
  n8n_data:
